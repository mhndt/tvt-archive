name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Repository consistency
        run: python3 scripts/check-version.py

      - name: Python and frontend tests
        run: bash tests/run-tests.sh

      - name: Shell syntax
        run: bash -n setup.sh docker/entrypoint.sh scripts/package-hacs.sh

      - name: ShellCheck
        run: shellcheck setup.sh docker/entrypoint.sh scripts/package-hacs.sh

      - name: Validate JSON
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          for path in Path('.').rglob('*.json'):
              json.loads(path.read_text(encoding='utf-8'))
              print(path)
          PY

      - name: Validate Compose files
        run: |
          cp .env.example .env
          docker compose -f compose/compose.yaml config --quiet
          docker compose -f compose/compose.yaml -f compose/intel-amd.yaml config --quiet
          docker compose -f compose/compose.yaml -f compose/nvidia.yaml config --quiet
          docker compose -f compose/compose.yaml -f compose/build-local.yaml config --quiet

      - name: Build HACS package
        run: scripts/package-hacs.sh

      - name: Upload HACS package test artifact
        uses: actions/upload-artifact@v4
        with:
          name: tvt-archive-hacs
          path: dist/
          if-no-files-found: error
